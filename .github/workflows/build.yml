name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 30
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" >/dev/null

      - name: Build (debug signed)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./build.sh

      - name: Build (release signed)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" ./build.sh
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: AppleTVWake
          path: dist/AppleTVWake.apk

      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/AppleTVWake.apk --title "$GITHUB_REF_NAME" --generate-notes
